[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quotemap"
version = "0.1.0"
description = "Show the quoting state of every character in a shell line, and which expansions actually expand."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["shell", "bash", "quoting", "lexer", "shell-scripting", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quotemap = "quotemap.cli:run"

[project.urls]
Source = "https://github.com/committed-nightly/quotemap"

[tool.hatch.build.targets.wheel]
packages = ["src/quotemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
